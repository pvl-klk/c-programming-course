name: Build and lint

on:
  - push
  - pull_request

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-format
        run: |
          wget -O - https://apt.llvm.org/llvm.sh | sudo bash -s 18
          sudo apt-get install -y clang-format-18
      - name: Check format
        run: |
          find . -path ./build -prune -o \( -name '*.c' -o -name '*.h' \) -type f \
            -exec clang-format-18 --style=file --dry-run -Werror {} \;
